<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T-AIRS Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .log-hidden { width: 0 !important; opacity: 0; pointer-events: none; border-left: none !important; }
        #log-panel { transition: all 0.3s ease; }
        #model-select option.local-option { background-color: #1e293b; color: #60a5fa; font-weight: bold; }
        #persona-context-display::-webkit-scrollbar { width: 4px; }
        #persona-context-display::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        .sidebar-section {
            background-color: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(51, 65, 85, 0.5);
            border-radius: 1rem;
            padding: 1.25rem;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 h-screen flex overflow-hidden font-sans">

    <aside class="w-80 bg-slate-900 text-white p-5 flex flex-col shadow-xl shrink-0 border-r border-slate-800">
        <div class="flex items-center gap-3 mb-10 px-1">
            <div class="bg-blue-600 p-2 rounded-lg"><i data-lucide="shield-check" class="w-5 h-5"></i></div>
            <h1 class="text-xl font-black tracking-tighter text-white uppercase italic">T-AIRS</h1>
        </div>

        <div class="flex flex-col gap-6 flex-1 min-h-0">
            <div class="sidebar-section">
                <div class="flex items-center justify-between mb-3">
                    <div class="flex items-center gap-2">
                        <i data-lucide="shield-alert" class="w-3.5 h-3.5 text-blue-400"></i>
                        <p class="text-[10px] font-bold text-blue-400 uppercase tracking-widest">AIRS Protection</p>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="airs-toggle" class="sr-only peer" checked>
                        <div class="w-8 h-4 bg-slate-600 rounded-full peer peer-checked:bg-green-500 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:after:translate-x-4 shadow-sm"></div>
                    </label>
                </div>
                <div id="airs-status-light" class="w-full h-1 bg-slate-700 rounded-full overflow-hidden mb-2">
                    <div id="status-bar" class="w-0 h-full bg-slate-500 transition-all duration-700"></div>
                </div>
                <div class="flex flex-col gap-1 overflow-hidden">
                    <span id="airs-status-text" class="text-[9px] font-bold text-slate-400 uppercase leading-tight italic truncate">Handshaking...</span>
                    <span id="airs-profile-text" class="text-[9px] text-blue-400 font-mono font-bold truncate tracking-tighter">NO_PROFILE</span>
                </div>
            </div>

            <div class="sidebar-section">
                <div class="flex items-center justify-between mb-3">
                    <div class="flex items-center gap-2">
                        <i data-lucide="cpu" class="w-3.5 h-3.5 text-blue-400"></i>
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">LLM Engine</p>
                    </div>
                    <label class="inline-flex items-center cursor-pointer" title="Enable AI Gateway Auto-Routing">
                        <span class="mr-2 text-[9px] font-bold text-slate-400 uppercase">Auto</span>
                        <input type="checkbox" id="auto-route-toggle" class="sr-only peer">
                        <div class="relative w-7 h-4 bg-slate-700 rounded-full peer peer-checked:bg-blue-500 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:after:translate-x-3 shadow-sm"></div>
                    </label>
                </div>
                
                <div id="manual-model-container" class="transition-all duration-300">
                    <select id="model-select" class="w-full bg-slate-800 border border-slate-700 text-slate-200 text-xs rounded-lg p-2.5 outline-none focus:ring-1 focus:ring-blue-500 cursor-pointer">
                        <option value="">Discovering models...</option>
                    </select>
                </div>

                <div id="auto-model-container" class="hidden bg-slate-800 border border-blue-500/50 rounded-lg p-2 text-center shadow-[0_0_10px_rgba(59,130,246,0.1)]">
                    <span class="text-[10px] font-bold text-blue-400 flex items-center justify-center gap-2">
                        <i data-lucide="zap" class="w-3 h-3 animate-pulse"></i>
                        GATEWAY AUTO-ROUTER
                    </span>
                </div>
            </div>

            <div class="sidebar-section">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <i data-lucide="history" class="w-3.5 h-3.5 text-blue-400"></i>
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Session History</p>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer" title="Keep conversation context">
                        <input type="checkbox" id="history-toggle" class="sr-only peer" checked>
                        <div class="w-8 h-4 bg-slate-700 rounded-full peer peer-checked:bg-blue-500 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:after:translate-x-4 shadow-sm"></div>
                    </label>
                </div>
                <p class="text-[9px] text-slate-500 mt-2 italic leading-tight">When enabled, the AI remembers previous messages in this session.</p>
            </div>

            <div class="sidebar-section flex-1 flex flex-col min-h-0 mb-4">
                <div class="flex items-center justify-between mb-3">
                    <div class="flex items-center gap-2">
                        <i data-lucide="binary" class="w-3.5 h-3.5 text-orange-400"></i>
                        <p class="text-[10px] font-bold text-orange-400 uppercase tracking-widest">System Prompt</p>
                    </div>
                    <button id="save-persona-btn" class="text-[9px] bg-orange-500/20 text-orange-400 px-2 py-1 rounded hover:bg-orange-500/40 transition font-bold tracking-widest cursor-pointer">SAVE</button>
                </div>
                <div class="flex-1 bg-black/40 rounded-lg border border-white/5 overflow-hidden flex flex-col relative shadow-inner">
                    <textarea id="persona-context-display" class="w-full h-full bg-transparent p-3 text-[11px] font-mono text-slate-300 outline-none resize-none leading-relaxed selection:bg-orange-500/30 transition-colors focus:bg-slate-900/50" spellcheck="false" placeholder="Loading context data..."></textarea>
                </div>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col bg-white relative">
        <header class="px-8 py-4 border-b border-slate-200 flex justify-between items-center bg-white sticky top-0 z-20 shadow-sm">
            
            <div class="flex items-center gap-4">
                <div class="flex bg-slate-100 p-1 rounded-xl border border-slate-200 shadow-inner">
                    <label class="flex items-center gap-2 px-4 py-1.5 rounded-lg cursor-pointer hover:text-slate-800 text-slate-500 font-semibold text-sm transition-all has-[:checked]:bg-white has-[:checked]:text-blue-600 has-[:checked]:shadow-sm">
                        <input type="radio" name="persona" value="banking" class="hidden" checked>
                        <i data-lucide="landmark" class="w-4 h-4"></i> Banking
                    </label>
                    <label class="flex items-center gap-2 px-4 py-1.5 rounded-lg cursor-pointer hover:text-slate-800 text-slate-500 font-semibold text-sm transition-all has-[:checked]:bg-white has-[:checked]:text-blue-600 has-[:checked]:shadow-sm">
                        <input type="radio" name="persona" value="travel" class="hidden">
                        <i data-lucide="plane" class="w-4 h-4"></i> Travel
                    </label>
                    <label class="flex items-center gap-2 px-4 py-1.5 rounded-lg cursor-pointer hover:text-slate-800 text-slate-500 font-semibold text-sm transition-all has-[:checked]:bg-white has-[:checked]:text-blue-600 has-[:checked]:shadow-sm">
                        <input type="radio" name="persona" value="eshop" class="hidden">
                        <i data-lucide="shopping-bag" class="w-4 h-4"></i> E-Shop
                    </label>
                </div>
                
                <div class="hidden md:flex items-center gap-2 text-[10px] text-slate-400 font-bold uppercase bg-slate-50 px-3 py-1.5 rounded-full border border-slate-200" id="engine-tag">-</div>
            </div>

            <div class="flex items-center gap-3">
                <button id="reset-session" class="flex items-center gap-2 px-4 py-2 rounded-full border border-red-200 text-xs font-bold text-red-600 shadow-sm hover:bg-red-50 transition-all">
                    <i data-lucide="refresh-cw" class="w-4 h-4"></i> New Session
                </button>
                <button id="toggle-logs" class="flex items-center gap-2 px-4 py-2 rounded-full border border-slate-200 text-xs font-bold text-slate-600 shadow-sm hover:bg-slate-50 transition-all">
                    <i data-lucide="terminal" class="w-4 h-4"></i> Inspector Logs
                </button>
            </div>
        </header>

        <div id="chat-box" class="chat-container flex-1 overflow-y-auto p-8 space-y-6 bg-slate-50/30"></div>

        <footer class="p-6 border-t border-slate-100 bg-white">
            <form id="chat-form" class="max-w-3xl mx-auto relative shadow-sm">
                <input type="text" id="msg" autoComplete="off" class="w-full bg-slate-100 rounded-2xl py-4 pl-6 pr-16 outline-none focus:ring-2 focus:ring-blue-500 border border-transparent transition-all" placeholder="Enter attack vector or prompt..." required>
                <button type="submit" class="absolute right-2 top-2 bottom-2 bg-blue-600 text-white px-5 rounded-xl hover:bg-blue-700 transition-colors shadow-lg">
                    <i data-lucide="send" class="w-4 h-4"></i>
                </button>
            </form>
        </footer>
    </main>

    <aside id="log-panel" class="w-[500px] bg-slate-900 flex flex-col border-l border-slate-800 log-hidden shadow-2xl">
        <div class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900/50">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest italic">Architecture Observability Trace</h3>
            <button onclick="document.getElementById('log-container').innerHTML=''" class="text-[10px] text-slate-500 hover:text-white uppercase font-bold transition">Clear</button>
        </div>
        <div id="log-container" class="flex-1 overflow-y-auto p-4 font-mono text-[10px] space-y-4"></div>
    </aside>

    <script>
        lucide.createIcons();
        let sessionId = 'sess_' + Math.random().toString(36).substr(2, 9);
        const chatForm = document.getElementById('chat-form');
        const chatBox = document.getElementById('chat-box');
        const logContainer = document.getElementById('log-container');

        // Fetch System Prompt into Editable Textarea
        async function updatePersonaDisplay(personaId) {
            const display = document.getElementById('persona-context-display');
            try {
                const res = await fetch(`/get-persona-context/${personaId}`);
                const data = await res.json();
                display.value = data.context;
                display.scrollTop = 0;
            } catch (e) { display.value = "Error loading context."; }
        }

        // Save System Prompt Logic
        document.getElementById('save-persona-btn').addEventListener('click', async () => {
            const btn = document.getElementById('save-persona-btn');
            const newContext = document.getElementById('persona-context-display').value;
            const activePersona = document.querySelector('input[name="persona"]:checked').value;
            
            btn.innerText = "SAVING...";
            btn.classList.add("text-white", "bg-orange-500");
            
            try {
                const res = await fetch('/update-persona', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: new URLSearchParams({'persona_id': activePersona, 'new_context': newContext})
                });
                if (res.ok) {
                    btn.innerText = "SAVED ✓";
                    btn.classList.replace("bg-orange-500", "bg-green-500");
                }
            } catch (e) {
                btn.innerText = "ERROR";
                btn.classList.replace("bg-orange-500", "bg-red-500");
            }
            
            setTimeout(() => {
                btn.innerText = "SAVE";
                btn.className = "text-[9px] bg-orange-500/20 text-orange-400 px-2 py-1 rounded hover:bg-orange-500/40 transition font-bold tracking-widest cursor-pointer";
            }, 2000);
        });

        // Fetch AI Models and populate the dropdown
        async function fetchModels() {
            try {
                const res = await fetch('/models');
                const data = await res.json();
                const select = document.getElementById('model-select');
                const msgInput = document.getElementById('msg');
                const submitBtn = chatForm.querySelector('button[type="submit"]');

                if (data.models && data.models.length > 0) {
                    // 🌟 THE FIX: Filter out 'auto-router' so it only exists as a toggle
                    const cleanModels = data.models.filter(m => m !== 'auto-router');

                    select.innerHTML = cleanModels.map(m => {
                        const isLocal = m.startsWith('local-');
                        return `<option value="${m}" class="${isLocal ? 'local-option' : ''}">${isLocal ? '🏠 ' + m + ' (Local)' : '☁️ ' + m}</option>`;
                    }).join('');
                    
                    // Set default selection to the first available real model
                    if (cleanModels.length > 0) {
                        select.value = cleanModels[0];
                        // Update the engine tag if the auto-toggle is currently OFF
                        if (!document.getElementById('auto-route-toggle').checked) {
                            document.getElementById('engine-tag').innerText = select.value;
                        }
                        msgInput.disabled = false;
                        submitBtn.disabled = false;
                        msgInput.placeholder = "Enter attack vector or prompt...";
                    }
                } else {
                    select.innerHTML = '<option value="">❌ No Cloud LLMs Detected</option>';
                    document.getElementById('engine-tag').innerText = "OFFLINE";
                    msgInput.disabled = true;
                    submitBtn.disabled = true;
                }
            } catch (e) { 
                console.error("Failed to fetch models:", e); 
            }
        }

        // Check AIRS Status
        async function checkAirsHealth() {
            try {
                const res = await fetch('/health-airs');
                const data = await res.json();
                const bar = document.getElementById('status-bar');
                const statusText = document.getElementById('airs-status-text');

                if (data.status === "connected") {
                    bar.className = "w-full h-full bg-green-500 shadow-[0_0_8px_#22c55e]";
                    statusText.innerText = "CONNECTED Prisma AIRS profile";
                    statusText.className = "text-[9px] font-bold text-green-400 uppercase tracking-tight";
                    document.getElementById('airs-profile-text').innerText = data.profile;
                } else {
                    bar.className = "w-full h-full bg-red-500 shadow-[0_0_8px_#ef4444]";
                    statusText.innerText = data.reason;
                    statusText.className = "text-[8px] font-mono text-red-400 leading-tight break-all";
                    document.getElementById('airs-profile-text').innerText = "ERROR";
                }
            } catch (e) {}
        }

        // Top Header Radio Buttons Change Logic
        document.querySelectorAll('input[name="persona"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                const val = e.target.value;
                updatePersonaDisplay(val);
            });
        });

        // Model Dropdown Change Logic
        document.getElementById('model-select').addEventListener('change', (e) => {
            document.getElementById('engine-tag').innerText = e.target.value;
        });

        // UI Toggles
        document.getElementById('toggle-logs').addEventListener('click', () => document.getElementById('log-panel').classList.toggle('log-hidden'));
        document.getElementById('reset-session').addEventListener('click', () => {
            if(confirm("Start a fresh session? This clears chat and generates a new session ID.")) {
                sessionId = 'sess_' + Math.random().toString(36).substr(2, 9);
                chatBox.innerHTML = '';
                logContainer.innerHTML = '';
            }
        });

        function appendMessage(role, text) {
            const isBot = role === 'bot';
            const html = `<div class="flex gap-3 ${isBot ? '' : 'flex-row-reverse ml-auto'} max-w-[85%] animate-in fade-in slide-in-from-bottom-2">
                <div class="w-8 h-8 rounded-full ${isBot ? 'bg-slate-100 border' : 'bg-blue-600'} flex items-center justify-center shrink-0 shadow-sm transition-transform hover:scale-110">
                    <i data-lucide="${isBot ? 'bot' : 'user'}" class="w-4 h-4 ${isBot ? 'text-slate-500' : 'text-white'}"></i>
                </div>
                <div class="${isBot ? 'bg-white text-slate-700 rounded-tl-none' : 'bg-blue-600 text-white rounded-tr-none'} p-4 rounded-2xl shadow-sm border text-sm leading-relaxed border-slate-200/50">
                    ${text.replace(/\n/g, '<br>')}
                </div>
            </div>`;
            chatBox.insertAdjacentHTML('beforeend', html);
            chatBox.scrollTop = chatBox.scrollHeight;
            lucide.createIcons();
        }

        // Chat Submit
        chatForm.onsubmit = async (e) => {
            e.preventDefault();
            const isAuto = document.getElementById('auto-route-toggle').checked;
            const modelId = isAuto ? "auto-router" : document.getElementById('model-select').value;
            
            if (!modelId) {
                appendMessage('bot', "⚠️ Cannot send message: No AI engine is currently available.");
                return; 
            }

            const historyToggle = document.getElementById('history-toggle');
            const historyEnabled = historyToggle ? historyToggle.checked : true;

            const msgInput = document.getElementById('msg');
            const message = msgInput.value;
            const persona = document.querySelector('input[name="persona"]:checked').value;
            const airsEnabled = document.getElementById('airs-toggle').checked;

            appendMessage('user', message);
            msgInput.value = '';

            const loadId = 'l-' + Date.now();
            chatBox.insertAdjacentHTML('beforeend', `<div id="${loadId}" class="text-[10px] text-slate-400 ml-11 italic flex items-center gap-2"><div class="w-1 h-1 bg-slate-400 rounded-full animate-ping"></div>Processing Request...</div>`);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: new URLSearchParams({
                        'message': message, 'persona': persona, 'session_id': sessionId,
                        'airs_enabled': airsEnabled, 'model_id': modelId, 'history_enabled': historyEnabled
                    })
                });
                const data = await res.json();
                if (document.getElementById(loadId)) document.getElementById(loadId).remove();

                if (data.bot) {
                    appendMessage('bot', data.bot);
                    
                    const statusText = data.logs.security_scan || "";
                    let borderColor = "border-l-slate-500";
                    let badgeColor = "bg-slate-900/50 text-slate-400";
                    
                    if (statusText.includes("INGRESS BLOCK")) {
                        borderColor = "border-l-red-500";
                        badgeColor = "bg-red-900/50 text-red-400";
                    } else if (statusText.includes("EGRESS BLOCK")) {
                        borderColor = "border-l-orange-500";
                        badgeColor = "bg-orange-900/50 text-orange-400";
                    } else if (statusText.includes("Passed")) {
                        borderColor = "border-l-green-500";
                        badgeColor = "bg-green-900/50 text-green-400";
                    }

                    // --- NEW OBSERVABILITY TRACE BUILDER ---
                    let traceHtml = "";
                    if (data.logs.trace) {
                        
                        // 1. RAG Pipeline Status Flag
                        if (data.logs.trace.rag_pipeline) {
                            const chunks = data.logs.trace.rag_pipeline.chunks_injected || [];
                            const hasContext = chunks.length > 0;
                            
                            // Calculate total characters to show "weight" of the data
                            const totalChars = chunks.join("").length;

                            traceHtml += `
                                <div class="mt-2 border-t border-slate-700/50 pt-2">
                                    <div class="flex items-center justify-between">
                                        <div class="text-[9px] text-purple-400 font-bold uppercase tracking-tighter italic">
                                            📚 1. RAG Grounding Status:
                                        </div>
                                        <span class="px-1.5 py-0.5 rounded text-[8px] font-bold ${hasContext ? 'bg-purple-500/20 text-purple-300 border border-purple-500/30' : 'bg-slate-700 text-slate-500'}">
                                            ${hasContext ? '✅ CONTEXT INJECTED' : '⚪ NO DATA FOUND'}
                                        </span>
                                    </div>
                                    ${hasContext ? `
                                        <div class="mt-1 flex gap-2">
                                            <div class="text-[8px] text-slate-500 uppercase font-mono">Size: ${totalChars} chars</div>
                                            <div class="text-[8px] text-slate-500 uppercase font-mono">Chunks: ${chunks.length}</div>
                                        </div>
                                        <details class="mt-1 group">
                                            <summary class="text-[8px] text-slate-600 hover:text-purple-400 cursor-pointer list-none flex items-center gap-1">
                                                <i data-lucide="eye" class="w-2 h-2"></i> Peek at injected data...
                                            </summary>
                                            <pre class="mt-1 bg-black/40 p-2 rounded text-[8px] text-purple-300/70 border border-slate-800 italic truncate max-h-16 overflow-hidden">
                                                ${chunks[0]}...
                                            </pre>
                                        </details>
                                    ` : ''}
                                </div>`;
                        }

                        // 2. AI Gateway Trace (Routes the augmented prompt)
                        if (data.logs.trace.ai_gateway && data.logs.trace.ai_gateway.routed_to) {
                            traceHtml += `
                                <div class="mt-2 border-t border-slate-700/50 pt-2">
                                    <div class="text-[9px] text-blue-400 font-bold mb-1 uppercase tracking-tighter italic">🚦 2. AI Gateway (Model Routed):</div>
                                    <div class="bg-black/60 p-2 rounded text-[9px] text-blue-300 border border-slate-800">Routed payload to: <b>${data.logs.trace.ai_gateway.routed_to}</b></div>
                                </div>`;
                        }

                        // 3. MCP Tool Execution Trace (LLM queries the DB)
                        if (data.logs.trace.mcp_execution && data.logs.trace.mcp_execution.length > 0) {
                            traceHtml += `
                                <div class="mt-2 border-t border-slate-700/50 pt-2">
                                    <div class="text-[9px] text-teal-400 font-bold mb-1 uppercase tracking-tighter italic">🔌 3. MCP Execution (Tool Called):</div>
                                    <pre class="bg-black/60 p-2 rounded overflow-x-auto text-[9px] text-teal-300 border border-slate-800 leading-tight">${JSON.stringify(data.logs.trace.mcp_execution, null, 2)}</pre>
                                </div>`;
                        }
                    }
                    // --- ASSEMBLE FULL LOG PANEL ---
                    const logHtml = `
                        <div class="bg-slate-800/40 border border-slate-700/50 rounded-lg p-3 text-slate-300 mb-4 shadow-xl border-l-4 ${borderColor} transition-all hover:bg-slate-800/60">
                            <div class="flex justify-between text-[9px] text-blue-400 mb-2 border-b border-slate-700/50 pb-1 font-bold">
                                <span>SESSION: ${sessionId.toUpperCase()}</span>
                                <span>${new Date().toLocaleTimeString()}</span>
                            </div>
                            
                            ${traceHtml}

                            <div class="mt-2 border-t border-slate-700/50 pt-2">
                                <div class="flex items-center justify-between mb-2">
                                    <div class="text-[9px] font-bold uppercase tracking-tighter italic ${statusText.includes('BLOCK') ? 'text-red-400' : 'text-green-400'}">
                                        🛡️ 4. Prisma AIRS Security Scan
                                    </div>
                                    <span class="px-2 py-0.5 rounded text-[9px] font-bold ${badgeColor} shadow-sm">
                                        ${statusText}
                                    </span>
                                </div>
                                
                                ${data.logs.intercepted_text ? `
                                <div class="mb-2">
                                    <div class="text-[8px] text-red-400 uppercase font-bold mb-1 flex items-center gap-1">
                                        <i data-lucide="shield-alert" class="w-2.5 h-2.5"></i> Intercepted Payload:
                                    </div>
                                    <div class="bg-red-950/40 p-2 rounded text-[9px] text-red-200 border border-red-900/50 max-h-32 overflow-y-auto whitespace-pre-wrap">${data.logs.intercepted_text.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</div>
                                </div>` : ""}

                                <pre class="bg-black/60 p-2 rounded overflow-x-auto text-[9px] text-slate-400 border border-slate-800 leading-tight">${data.logs.raw_response}</pre>
                            </div>
                        </div>`;
                    
                    logContainer.insertAdjacentHTML('afterbegin', logHtml);
                }
            } catch (err) {
                if (document.getElementById(loadId)) document.getElementById(loadId).remove();
                appendMessage('bot', "⚠️ Backend connection error.");
            }
        };

        // Auto-Router Toggle Logic
        const autoToggle = document.getElementById('auto-route-toggle');
        const manualContainer = document.getElementById('manual-model-container');
        const autoContainer = document.getElementById('auto-model-container');
        const engineTag = document.getElementById('engine-tag');

        autoToggle.addEventListener('change', (e) => {
            if (e.target.checked) {
                // Turn Auto ON
                manualContainer.classList.add('hidden');
                autoContainer.classList.remove('hidden');
                engineTag.innerHTML = '<i data-lucide="zap" class="w-3 h-3 text-blue-500"></i> AUTO-ROUTING';
            } else {
                // Turn Auto OFF
                manualContainer.classList.remove('hidden');
                autoContainer.classList.add('hidden');
                engineTag.innerText = document.getElementById('model-select').value;
            }
            lucide.createIcons();
        });

        window.addEventListener('DOMContentLoaded', () => {
            fetchModels();
            checkAirsHealth();
            const activePersona = document.querySelector('input[name="persona"]:checked').value;
            updatePersonaDisplay(activePersona);
        });
    </script>
</body>
</html>
